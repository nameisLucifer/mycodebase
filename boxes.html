<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .class {
        box-sizing: border-box;
        width: 100px;
        padding: 20px;
        border: 2px solid lightblue;
        display: inline-block;
    }

    .class1 {
        box-sizing: content-box;
        width: 100px;
        padding: 20px;
        border: 2px solid lightblue;
    }

    .class2 {
        box-sizing: content-box;
        width: 10%;
        padding: 20px;
        border: 2px solid lightblue;
    }
</style>

<body>
    <div class="class">
    </div> <br>
    <div class="class1">
    </div>
    <br>
    <div class="class2"></div>
</body>

</html>
